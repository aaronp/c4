# Checks the viewer and publishes it to GitHub Pages as index.html, with the examples beside it
# (no Jekyll, so the example .md files are served raw for the viewer to fetch).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The github-pages environment must allow your branch (see README).
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R Main.dc.html support.js vendor examples spec.md _site/
          cp Main.dc.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
